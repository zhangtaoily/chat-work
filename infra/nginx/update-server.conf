# 桌面端内网更新 feed（PRD 5.5.2 / 5.5.6）：electron-updater generic provider 静态托管
# 挂载根：releases/desktop（compose update-server 服务 → /usr/share/nginx/html）
# 目录约定：{stable,beta}/latest.yml + 同目录安装包（.exe/.blockmap），双通道目录隔离
server {
  listen 80;
  server_name _;

  # feed 与安装包内网可匿名下载；灰度准入由 agent-core GRAY_PERCENT/MIN_CLIENT_VERSION 控制
  location /releases/desktop/ {
    alias /usr/share/nginx/html/;
    # latest.yml 必须每次回源拿最新（electron-updater 依据其判定版本）
    add_header Cache-Control "no-cache";
    autoindex off;
  }

  # 存活探针（compose healthcheck / 运维巡检）
  location = /healthz {
    return 200 "ok\n";
  }
}
