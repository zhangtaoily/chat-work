# mock-idp：本地 OIDC Broker（模拟 Keycloak 身份代理，PRD 8.5）
# 生产切换：仅需将 SSO_ISSUER 指向真实 Keycloak，协议端点兼容 OIDC 标准
[project]
name = "mock-idp"
version = "0.1.0"
description = "Mock OIDC Provider：authorize/token/JWKS/discovery，RS256 + PKCE，供 SSO 联调"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.8", # RS256 签发（cryptography 随 extra 安装）
    "python-multipart>=0.0.9", # Form 表单解析（authorize/token 端点）
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27", # 测试经 ASGITransport 直连 app
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_idp"]
