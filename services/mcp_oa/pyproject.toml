# mcp-oa：OA 系统 MCP Server（工具前缀 oa__，ARCHITECTURE 4.2）
[project]
name = "mcp-oa"
version = "0.1.0"
description = "OA MCP Server：请假/报销/请购/审批（流程审批，Streamable HTTP）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2",
    "sqlalchemy>=2",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
