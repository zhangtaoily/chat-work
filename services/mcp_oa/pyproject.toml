# mcp-oa：OA 系统 MCP Server（工具前缀 oa__，ARCHITECTURE 4.2）
[project]
name = "mcp-oa"
version = "0.1.0"
description = "OA MCP Server：请假/报销/请购/审批（流程审批，Streamable HTTP）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2", # 官方 Python SDK 1.x（2.x 重命名 FastMCP→MCPServer，迁移另行评估）
    "httpx>=0.27",
    "cryptography>=42", # E9 认证链 RSA 加密（regist/applytoken/userid 头）
    "python-dotenv>=1.0", # server.py 加载服务目录 .env（OA_MODE=E9_* 配置）
    "pydantic>=2",
    "sqlalchemy>=2",
    "aiomysql>=0.2", # MySQL 8 优先（v1.6）；兼容 PG 时切 psycopg，ORM 模型不变
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "aiosqlite>=0.20", # 开发期无库冒烟：SQLite 内存幂等表
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
