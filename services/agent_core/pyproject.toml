# agent-core：Agent 核心服务（FastAPI + LangGraph，ARCHITECTURE 4.1）
[project]
name = "agent-core"
version = "0.1.0"
description = "Chat-Work Agent 核心：流水线/技能/记忆/知识/护栏/自动化"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "langgraph>=0.2",
    "mcp>=1.0",
    "httpx>=0.27",
    "sqlalchemy>=2",
    "asyncpg>=0.29",
    "redis>=5",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]
