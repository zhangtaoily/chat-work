# agent-core：Agent 核心服务（FastAPI + LangGraph，ARCHITECTURE 4.1）
[project]
name = "agent-core"
version = "0.1.0"
description = "Chat-Work Agent 核心：流水线/技能/记忆/知识/护栏/自动化"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "langgraph>=0.2",
    "mcp>=1.0,<2", # 官方 Python SDK 1.x（2.x 重命名 FastMCP→MCPServer，迁移另行评估）
    "httpx>=0.27",
    "sqlalchemy>=2",
    "aiomysql>=0.2", # MySQL 8 优先（v1.6）；兼容 PG 时切 psycopg，ORM 模型不变
    "psycopg[binary]>=3.2",
    "redis>=5",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.8", # SSO JWT 验签（RS256 + JWKS，PRD 8.5）
    "jinja2>=3.1", # Web 管理后台服务端渲染（PLAN P2.7，PRD 5.6）
    "python-multipart>=0.0.9", # 管理后台表单解析（CSRF/_csrf 提交）
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20", # 开发期无库冒烟：SQLite 内存幂等/会话存储
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]
